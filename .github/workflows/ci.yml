# Runs on every push and pull request: build, unit tests, the package check and the end-to-end tests (about a
# minute). The live-PayPal fidelity suite stays manual (npm run fidelity): it needs real sandbox keys.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - run: npm run test:e2e
      - run: npm run check:version
      - run: npm audit --omit=dev --audit-level=high
